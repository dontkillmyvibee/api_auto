services:
  gitlab-runner:
    image: gitlab/gitlab-runner:v17.11.1
    container_name: api-auto-gitlab-runner
    restart: unless-stopped
    volumes:
      # Runner config (config.toml + keys). Not committed — see .gitignore.
      - ./runner/config:/etc/gitlab-runner
      # Docker executor talks to host Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    # So job containers can resolve host.docker.internal → host stand ports.
    extra_hosts:
      - "host.docker.internal:host-gateway"
