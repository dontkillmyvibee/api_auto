# Production-like pipeline for api-auto (Mac Docker runner).
#
# Flow: stand up → quality → test → allure report (+ Pages) → stand down
# Stand is cloned into STAND_HOST_PATH (bind-mounted into jobs) and started
# via docker.sock on Docker Desktop. Mac must be online for the runner to work.

stages:
  - stand
  - quality
  - test
  - report
  - teardown

variables:
  # Same absolute path on Mac host and in job containers (see runner volumes).
  STAND_HOST_PATH: "/Users/anatolijkoleda/ci-stand/performance-qa-engineer-course"
  STAND_REPO: "https://github.com/Nikita-Filonov/performance-qa-engineer-course.git"
  STAND_REF: "main"
  API_BASE_URL: "http://host.docker.internal:8003"
  API_TIMEOUT: "30"
  LOG_LEVEL: "INFO"
  DATABASE_HOST: "host.docker.internal"
  DATABASE_PORT: "5432"
  # Educational stand defaults (postgres service in docker-compose.yaml).
  DATABASE_USER: "root"
  DATABASE_PASSWORD: "root"
  KAFKA_BOOTSTRAP_SERVERS: "host.docker.internal:9093"
  KAFKA_GROUP_ID: "api-auto-tests-ci"
  KAFKA_AUTO_OFFSET_RESET: "earliest"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  ALLURE_VERSION: "2.44.0"

default:
  tags:
    - api-auto
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

.uv_job:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .venv/
  before_script:
    - |
      cat > .env <<EOF
      API.BASE_URL=${API_BASE_URL}
      API.TIMEOUT=${API_TIMEOUT}
      LOG_LEVEL=${LOG_LEVEL}
      DATABASE.HOST=${DATABASE_HOST}
      DATABASE.PORT=${DATABASE_PORT}
      DATABASE.USER=${DATABASE_USER}
      DATABASE.PASSWORD=${DATABASE_PASSWORD}
      KAFKA.BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA.GROUP_ID=${KAFKA_GROUP_ID}
      KAFKA.AUTO_OFFSET_RESET=${KAFKA_AUTO_OFFSET_RESET}
      EOF
    - uv sync --frozen --all-groups

stand:up:
  stage: stand
  image: docker:27-cli
  timeout: 2h
  interruptible: false
  resource_group: bank-stand
  variables:
    COMPOSE_KAFKA_OVERRIDE: "ci/stand/docker-compose.kafka-host.yaml"
  before_script:
    - apk add --no-cache git bash curl
  script:
    - bash ci/stand/up.sh

lint:
  extends: .uv_job
  stage: quality
  needs: ["stand:up"]
  script:
    - uv run ruff check .

format:
  extends: .uv_job
  stage: quality
  needs: ["stand:up"]
  script:
    - uv run ruff format --check .

typecheck:
  extends: .uv_job
  stage: quality
  needs: ["stand:up"]
  script:
    - uv run mypy .

test:
  extends: .uv_job
  stage: test
  needs: ["stand:up", "lint", "format", "typecheck"]
  script:
    - uv run pytest
  artifacts:
    when: always
    paths:
      - allure-results/
    expire_in: 14 days

allure:report:
  stage: report
  image: eclipse-temurin:17-jre-jammy
  when: always
  needs:
    - job: test
      artifacts: true
  cache:
    key: allure-history
    paths:
      - allure-report/history/
    policy: pull-push
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates
    - |
      curl -fsSL \
        "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
        | tar -xz -C /opt
    - ln -sf "/opt/allure-${ALLURE_VERSION}/bin/allure" /usr/local/bin/allure
    - allure --version
  script:
    - |
      mkdir -p allure-results
      if [ -d allure-report/history ]; then
        echo "Restoring Allure history for trends..."
        cp -R allure-report/history allure-results/history
      fi
    - allure generate allure-results --clean -o allure-report
    - |
      mkdir -p public
      cp -R allure-report/. public/
    - |
      REPORT_URL="${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/allure-report/index.html"
      echo "ALLURE_REPORT_URL=${REPORT_URL}" > allure.env
      echo ""
      echo "=============================================="
      echo "Allure report: ${REPORT_URL}"
      echo "=============================================="
  artifacts:
    when: always
    expose_as: "Allure report"
    paths:
      - allure-report/
      - public/
    reports:
      dotenv: allure.env
    expire_in: 30 days
  environment:
    name: allure/$CI_COMMIT_REF_SLUG
    url: $ALLURE_REPORT_URL

pages:
  stage: report
  image: alpine:3.21
  needs:
    - job: allure:report
      artifacts: true
  script:
    - echo "Publishing Allure report to GitLab Pages"
    - echo "Pages URL: https://dontkillmyvibe-group1.gitlab.io/api-auto"
    - ls -la public | head
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: allure-pages
    url: https://dontkillmyvibe-group1.gitlab.io/api-auto

stand:down:
  stage: teardown
  image: docker:27-cli
  when: always
  interruptible: false
  resource_group: bank-stand
  # No `needs:` — must wait for quality/test/report stages so the stand
  # is not torn down while pytest is still running.
  before_script:
    - apk add --no-cache bash
  script:
    - bash ci/stand/down.sh
